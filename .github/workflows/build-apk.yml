name: Build APK

on:
  push:
    branches: [main, v2-pro]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install opencv-python-headless numpy
      - run: python3 test/test_counter.py

  build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install buildozer deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev automake

      - name: Install buildozer + cython
        run: pip install buildozer Cython==0.29.36

      - name: Pre-accept Android licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          cd /tmp
          curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdtools.zip
          unzip -q cmdtools.zip -d cmdtools-tmp
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mv cmdtools-tmp/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "8933bad161af4178b1185a5a56d800b26f0c7a59" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabfb336dd316432923cb30c739a" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "24333f8a63b90f3361ddbbef20f9d63b772c9506" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -2

      - name: Build APK (debug)
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug --verbose
        timeout-minutes: 60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCounter-apk
          path: bin/*.apk