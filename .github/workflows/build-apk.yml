name: Build APK

on:
  push:
    branches: [main, v2-pro]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install opencv-python-headless numpy
      - run: python3 test/test_counter.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install buildozer deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev automake

      - name: Install buildozer + cython
        run: pip install buildozer Cython==0.29.36

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK (debug)
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug --verbose
        timeout-minutes: 60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCounter-apk
          path: bin/*.apk